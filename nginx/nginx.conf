# Se monta en /etc/nginx/conf.d/default.conf, que la imagen incluye dentro del bloque http.

# --- Limite por IP: solo POST. Para otros metodos la clave queda vacia y Nginx no los limita. ---
map $request_method $envios_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $envios_limit_key zone=envios_limit:10m rate=2r/s;

# --- Registro de acceso en JSON, sin cuerpo ni cabeceras (no hay datos personales ni credenciales) ---
log_format evidencia escape=json
    '{"hora":"$time_iso8601","msec":"$msec","ip_cliente":"$remote_addr","metodo":"$request_method",'
    '"ruta":"$uri","estado":$status,"limit_req":"$limit_req_status","upstream":"$upstream_addr",'
    '"upstream_estado":"$upstream_status","tiempo_s":$request_time,"request_id":"$request_id"}';

# Marca las respuestas HTTP 429 para escribirlas tambien en su propio archivo.
map $status $es_rechazo_429 {
    429     1;
    default 0;
}

# DNS interno de Docker. Cuando una replica se detiene y vuelve (o se recrea) su IP puede cambiar;
# con "resolve" Nginx vuelve a consultar el nombre cada 2 s en lugar de recordar la IP del arranque.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream backend_app {
    # zone: el estado del round robin se comparte entre los procesos worker de Nginx
    # (y es requisito de "resolve").
    zone backend_app 64K;
    # Si una replica falla, se la excluye 5 s y se reintenta despues.
    server app1:3000 resolve max_fails=1 fail_timeout=5s;
    server app2:3000 resolve max_fails=1 fail_timeout=5s;
    server app3:3000 resolve max_fails=1 fail_timeout=5s;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Archivos persistentes (volumen nginx_logs): sobreviven a la recreacion del contenedor.
    access_log /var/log/nginx-evidencia/acceso.jsonl evidencia;
    access_log /var/log/nginx-evidencia/rechazos_429.jsonl evidencia if=$es_rechazo_429;
    access_log /dev/stdout evidencia;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    # Si una replica no existe (contenedor detenido), no esperar 60 s: pasar a la siguiente en 2 s.
    # Un POST solo se reenvia a otra replica si el fallo ocurrio ANTES de enviarle la solicitud.
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;

    # POST /envios: 2 solicitudes por segundo por IP, rafaga adicional de 4, exceso rechazado con 429.
    # nodelay: las solicitudes de la rafaga se procesan de inmediato, sin encolarse.
    location /envios {
        limit_req zone=envios_limit burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_app;
    }

    location / {
        proxy_pass http://backend_app;
    }
}
