name: envios-app

# Plantilla comun de las tres replicas: misma imagen, misma base, mismo comportamiento.
x-app: &app
  image: ${DOCKERHUB_USER:?Defina DOCKERHUB_USER en el archivo .env}/envios-app:${APP_VERSION:-1.0.0}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?Defina DB_USER en el archivo .env}
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
  DB_NAME: ${DB_NAME:?Defina DB_NAME en el archivo .env}
  ENABLE_TEST_DELAY: ${ENABLE_TEST_DELAY:-false}

services:
  # Las replicas solo se diferencian en INSTANCE_ID. No publican puertos: 3000 es interno.
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Defina DB_USER en el archivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME en el archivo .env}
    ports:
      # DBeaver: localhost:15432. Solo escucha en el equipo local (127.0.0.1), no en la red.
      - "127.0.0.1:15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicializacion PostgreSQL solo acepta conexiones por socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx-evidencia
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy

volumes:
  db_data:
  nginx_logs:
